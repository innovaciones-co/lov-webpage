<fieldset>
  <legend>{{ label() }}</legend>
  @for (option of options(); track option.value) {
  <div class="radio-option">
    <input type="radio" [id]="id() + '-' + option.value" [formControl]="control()" [value]="option.value"
      [attr.name]="id()" (blur)="onBlur()" />
    <label [attr.for]="id() + '-' + option.value">
      @if (option.template) {
      <ng-container *ngTemplateOutlet="option.template"></ng-container>
      } @else if (option.label) {
      <span [innerHTML]="sanitizeHtml(option.label)"></span>
      }
    </label>
  </div>
  }
</fieldset>
@if (control().invalid && control().touched) {
<div class="error">{{ error() }}</div>
}
