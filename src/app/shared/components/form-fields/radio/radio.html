<fieldset>
  <legend>{{ label() }}</legend>
  @for (option of options(); track option.value) {
  <div class="radio-option">
    <input type="radio" [id]="id + '-' + option.value" [value]="option.value"
      [checked]="control().value === option.value" [attr.name]="id" (change)="onChange($event)" />
    <label [attr.for]="id + '-' + option.value">
      @if (option.template) {
      <ng-container *ngTemplateOutlet="option.template; context: { card: option }"></ng-container>
      } @else if (option.label) {
      <span [innerHTML]="sanitizeHtml(option.label)"></span>
      }
    </label>
    @if (option.actionIcon) {
    <button type="button" (click)="onAction(option.value)" [title]="option.actionLabel">
      <span class="material-symbols-outlined">{{ option.actionIcon }}</span>
    </button>
    }
  </div>
  }
</fieldset>
@if (control().invalid && control().touched) {
<div class="error">{{ error() }}</div>
}
