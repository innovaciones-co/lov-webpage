<label [attr.for]="id()">{{ label() }}</label>
<input [id]="id()" type="text" [formControl]="control()" [placeholder]="placeholder()" [autocomplete]="autocomplete()"
  [attr.aria-label]="label()" (blur)="onBlur()" [class.invalid]="control().invalid && control().touched" />
@if (control().invalid && control().touched) {
<div class="error">{{ error() }}</div>
}
@else {
<div class="error"></div>
}
