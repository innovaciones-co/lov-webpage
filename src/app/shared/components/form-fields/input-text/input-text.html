<label [attr.for]="id()">{{ label() }}</label>
<input
  [id]="id()"
  type="text"
  [formControl]="control()"
  [placeholder]="placeholder()"
  [attr.aria-label]="label()"
  (blur)="onBlur()"
  [class.invalid]="control().invalid && control().touched"
/>
@if (control().invalid && control().touched) {
<div class="error">{{ error() }}</div>
}
