<label [attr.for]="id()">{{ label() }}</label>
<input [id]="id()" type="number" [formControl]="control()" [placeholder]="placeholder()" [attr.aria-label]="label()"
    [attr.min]="min()" [attr.max]="max()" [attr.step]="step()" (blur)="onBlur()" (input)="onInput($event)"
    [class.invalid]="control().invalid && control().touched" />
@if (control().invalid && control().touched) {
<div class="error">{{ error() }}</div>
}
@else {
<div class="error"></div>
}
