<div class="switch-container">
    <label [for]="id()" class="switch-label">
        <button type="button" [id]="id()" class="switch-toggle" [class.active]="control().value"
            (click)="toggleSwitch()" role="switch" [attr.aria-checked]="control().value">
            <span class="switch-slider"></span>
        </button>
        <span class="switch-text">{{ displayLabel() }}</span>
    </label>
</div>
