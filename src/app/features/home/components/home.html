<section class="telemedicine-campaign" aria-label="Telemedicina incluida en tu plan mensual LOV">
  <div class="telemedicine-campaign__art">
    <a class="telemedicine-campaign__destination" routerLink="/telemedicina"
      aria-label="Conoce el beneficio de telemedicina de tu plan mensual LOV">
      <picture>
        <source media="(max-width: 420px)" srcset="telemedicina/campana-movil-v2.webp" width="1080" height="1350">
        <source media="(max-width: 700px)" srcset="telemedicina/campana-cuadrada-v2.webp" width="1080" height="1080">
        <img src="telemedicina/campana-web-v2.webp" width="1920" height="873" loading="eager" fetchpriority="high"
          alt="Tu plan mensual LOV ahora incluye telemedicina general y pediátrica para ti y hasta dos familiares elegibles. Aplican términos y condiciones.">
      </picture>
    </a>
    <a class="telemedicine-campaign__call" href="tel:+576016462811"
      aria-label="Llamar a AXA al (601) 646 2811 para solicitar telemedicina"></a>
  </div>
  <div class="telemedicine-campaign__caption">
    <span>Un beneficio de tu plan mensual LOV</span>
    <a routerLink="/telemedicina">Conocer más <span aria-hidden="true">↗</span></a>
  </div>
</section>
