<form [formGroup]="form()" (ngSubmit)="onSubmit()">
    <div class="card">
        <h3 class="form-subtitle">Información personal</h3>
        <div class="form-grid">
            <div class="form-row">
                <input-text-field [label]="'Nombre'" [placeholder]="'Arturo'" [control]="form().controls.name"
                    [error]="getFieldErrorMessage('name')"></input-text-field>

                <input-text-field [label]="'Apellidos'" [placeholder]="'Pérez Rodiguez'"
                    [control]="form().controls.lastName" [error]="getFieldErrorMessage('lastName')"></input-text-field>
            </div>
            <div class="form-row">
                <select-field [label]="'Tipo de documento'" [placeholder]="''" [options]="documentType()"
                    [control]="form().controls.documentType"
                    [error]="getFieldErrorMessage('documentType')"></select-field>

                <input-text-field [label]="'Documento'" [placeholder]="'123456789'"
                    [control]="form().controls.documentID"
                    [error]="getFieldErrorMessage('documentID')"></input-text-field>
            </div>
        </div>
        <h3 class="form-subtitle">Información de contacto</h3>
        <div class="form-grid">
            <div class="form-row">
                <input-text-field [label]="'Correo electrónico'" [placeholder]="'andres@myemail.com'"
                    [control]="form().controls.email" [error]="getFieldErrorMessage('email')"></input-text-field>

                <input-text-field [label]="'Teléfono para contactarte'" [placeholder]="'3001234567'"
                    [control]="form().controls.phoneNumber"
                    [error]="getFieldErrorMessage('phoneNumber')"></input-text-field>
            </div>
            <div class="form-row">
                <input-text-field [label]="'Ciudad'" [placeholder]="''" [control]="form().controls.city"
                    [error]="getFieldErrorMessage('city')"></input-text-field>

                <input-text-field [label]="'Dirección'" [placeholder]="'Cra 00 #00-00'"
                    [control]="form().controls.address" [error]="getFieldErrorMessage('address')"></input-text-field>
            </div>
            <div class="form-row">
                <input-text-field [label]="'Información complementaria'"
                    [placeholder]="'Conjunto, casa, torre, apartamento, etc.'"
                    [control]="form().controls.addressOptional"
                    [error]="getFieldErrorMessage('addressOptional')"></input-text-field>
            </div>
        </div>
        <h3 class="form-subtitle">Información del dispositivo</h3>
        <div class="form-grid">
            <div class="form-row">
                <select-field [label]="'Selecciona el IMEI de tu dispositivo'" [placeholder]="''" [options]="imeiList()"
                    [control]="form().controls.imei" [disabled]="imeiList().length === 0"
                    [error]="getFieldErrorMessage('imei')"></select-field>
            </div>
        </div>
        <error-card [message]="validationError()"></error-card>
    </div>
    <button class="btn" type="submit" [disabled]="form().invalid">Continuar</button>
</form>
