<div class="parent-container">
  <span class="eyebrow">
    <app-lov-heart class="eyebrow__heart" [withCircle]="false" />
    Planes LOV
  </span>
  <h2 class="title">Elige <span class="title__accent">tu plan</span> ahora</h2>
  @if (loading()) {
  <span class="loading-spinner"></span>
  }
  @else {
  <div class="carrusel-container">
    <app-nav-arrow direction="back" (onClick)="goBack()"></app-nav-arrow>
    <div class="container">
      <ul class="cards-list">
        @for (plan of visiblePlans(); track plan.id) {
        <!-- Same color per plan as on /planes: its position in the full sorted list. -->
        <app-plan-item [plan]="plan" [accentIndex]="page() * pageSize() + $index"></app-plan-item>
        }
      </ul>
    </div>
    <app-nav-arrow direction="next" (onClick)="goNext()"></app-nav-arrow>
  </div>
  }

  <button class="btn btn-secondary" (click)="navigateToPlans()">
    Ver todos los planes
  </button>
</div>
