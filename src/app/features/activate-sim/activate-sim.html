<div class="container">
    <h1>Activa tu SIM en minutos</h1>
    <p>Solo necesitarás tus datos personales y el número de tu SIM.
    </p>
    <div class="stepper-container">
        <!-- Step Content -->
        <div class="step-content-container">
            <app-iccid-validation-form [hideButton]="showPersonalInfoForm()" (formSubmit)="onIccidValidationFormSubmit($event)"></app-iccid-validation-form>
            @if (showPersonalInfoForm()) {
            <app-personal-info-form (formSubmit)="onPersonalInfoFormSubmit($event)"></app-personal-info-form>
            }
        </div>
    </div>

</div>
