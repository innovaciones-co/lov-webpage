<div class="container">
    <h1>Activa tu SIM en minutos</h1>
    <p>Solo necesitarás tus datos personales y el número de tu SIM.
    </p>
    <div class="stepper-container">
        <!-- Step Content -->
        <div class="step-content-container">
            <div class="form-wrapper">
                <app-iccid-validation-form [hideButton]="showDocumentValidationForm()"
                    (formSubmit)="onIccidValidationFormSubmit($event)"></app-iccid-validation-form>
            </div>
            @if (showDocumentValidationForm()) {
            <div class="form-wrapper">
                <app-document-validation [hideButton]="showPersonalInfoForm()" (formSubmit)="onDocumentValidationFormSubmit($event)"></app-document-validation>
            </div>
            }
            @if (showPersonalInfoForm()) {
            <div class="form-wrapper">
                <app-personal-info-form (formSubmit)="onPersonalInfoFormSubmit($event)"></app-personal-info-form>
            </div>
            }
        </div>
    </div>

</div>
