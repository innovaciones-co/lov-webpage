<div class="container">
    <app-page-header eyebrow="Activación" title="Activa tu SIM en segundos" accent="en segundos" icon="sim_card">
        Solo necesitarás tus datos personales y el número de tu SIM.
    </app-page-header>
    <div class="stepper-container">
        <!-- Step Content -->
        <div class="step-content-container">
            <div class="form-wrapper">
                <app-iccid-validation-form [hideButton]="showDocumentValidationForm()"
                    (formSubmit)="onIccidValidationFormSubmit($event)"></app-iccid-validation-form>
            </div>
            @if (showDocumentValidationForm()) {
            <div class="form-wrapper">
                <app-document-validation [hideButton]="showPersonalInfoForm()"
                    (formSubmit)="onDocumentValidationFormSubmit($event)"></app-document-validation>
            </div>
            }
            @if (showPersonalInfoForm()) {
            <div class="form-wrapper">
                <app-personal-info-form [documentValidationData]="documentValidationData()"
                    [iccid]="iccidData()?.iccid || ''"
                    (formSubmit)="onPersonalInfoFormSubmit($event)"></app-personal-info-form>
            </div>
            }
        </div>
    </div>

</div>
