<successful-process [icon]="icon" [title]="title">
    <div class="info-details">
        <p class="success-description">Tu SIM LOV está activa y lista para usarse.</p>
        @if (msisdn()) {
        <p class="phone-number">Número de teléfono LOV: <em>{{ msisdn() }}</em></p>
        }
        <p class="activation-info">En breve recibirás un mensaje de confirmación. Conéctate, disfruta y vive la
            experiencia LOV con todo el amor que te mereces.
        </p>
    </div>
    <div>
        <a href="/planes" class="link-button">Activa un plan</a>, <a href="/recargas" class="link-button">Recarga
            saldo</a> o <a href="/portabilidad" class="link-button">Inicia una portabilidad</a>.
    </div>
</successful-process>
