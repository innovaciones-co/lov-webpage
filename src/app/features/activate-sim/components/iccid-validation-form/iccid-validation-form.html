<form [formGroup]="form()" (ngSubmit)="onSubmit()">
    <div class="card">
        <h3 class="form-subtitle">Ingresa tú número LOV</h3>
        <div class="form-grid">
            <div class="form-row">
                <input-text-field [label]="'Código de barrras de tu SIM'" [placeholder]="'0000000000'"
                    [control]="form().controls.iccid" [error]="getFieldErrorMessage('iccid')"
                    [autocomplete]="'tel'"></input-text-field>

                <input-text-field [label]="'Código PUK'" [placeholder]="'00000000'" [control]="form().controls.puk"
                    [error]="getFieldErrorMessage('puk')" [autocomplete]="'on'"></input-text-field>
            </div>
        </div>
    </div>
    @if (!hideButton()) {
        <button class="btn" type="submit" [disabled]="form().invalid">Continuar</button>
    }
</form>
