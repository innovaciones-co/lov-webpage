<form [formGroup]="form()" (ngSubmit)="onSubmit()">
    <div class="card">
        <h3 class="form-subtitle">Ingresa el serial de la SIM LOV</h3>
        <div class="form-grid">
            <div class="form-row">
                <input-text-field [label]="'Completa los últimos 6 dígitos del serial'"
                    [placeholder]="'8957777200231XXXXXX'" [control]="form().controls.iccid"
                    [error]="getFieldErrorMessage('iccid')"></input-text-field>

                <input-text-field [label]="'Código PUK (Ubícalo en la parte posterior de tu tarjeta SIM)'"
                    [placeholder]="'Número de 8 dígitos'" [control]="form().controls.puk"
                    [error]="getFieldErrorMessage('puk')"></input-text-field>
            </div>
        </div>

        <error-card [message]="validationError()"></error-card>

    </div>
    @if (!hideButton()) {
    <button class="btn" type="submit" [disabled]="isLoading() || form().invalid">
        @if (isLoading()) {
        <span class="loading-spinner"></span>
        Validando...
        } @else {
        Continuar
        }
    </button>
    }
</form>
