<section class="lovers">
    <!-- Decorative floating logo hearts -->
    <app-lov-heart class="float-heart float-heart--1" [withCircle]="false" />
    <app-lov-heart class="float-heart float-heart--2" [withCircle]="false" />
    <app-lov-heart class="float-heart float-heart--3" [withCircle]="false" />
    <app-lov-heart class="float-heart float-heart--4" [withCircle]="false" />
    <app-lov-heart class="float-heart float-heart--5" [withCircle]="false" />

    <article class="lovers-inner">
        <div class="big-heart">
            <span class="big-heart__ring" aria-hidden="true"></span>
            <span class="big-heart__ring big-heart__ring--2" aria-hidden="true"></span>
            <!-- Official animated LOV logo (transparent GIF from the brand team). -->
            <img class="big-heart__logo" src="lov-logo-animado.gif" width="480" height="382"
                alt="Logo de LOV Mobile" loading="lazy">
        </div>

        <h2 class="lovers-title">Todas las personas somos <span class="lovers-title__accent">Lovers</span> en potencia.</h2>

        <p class="lovers-text">
            Pero un verdadero Lover es aquel que, impulsado por el amor, <strong>busca generar grandes cambios</strong>.
            Sabe que un pequeño acto, hecho en comunidad, tiene el poder para generar grandes transformaciones.
        </p>
    </article>
</section>
