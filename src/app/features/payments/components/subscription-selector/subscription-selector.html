<div class="card">
	<div class="card-header">
		<h3 class="form-subtitle">Línea a recargar</h3>
		<p>Selecciona un número de teléfono</p>
	</div>

	<div>
		<radio-field [options]="subscriptionOptions()" [control]="subscriptionControl"
			(valueChange)="onSubscriptionChange($event)"></radio-field>
	</div>
</div>

<ng-template #subscriptionTemplate let-card="card">
	<p class="option-description">{{ card.phone }}</p>
</ng-template>
