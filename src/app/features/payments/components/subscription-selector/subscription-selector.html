<div class="card">
	<div class="card-header">
		<h3 class="form-subtitle">¿Para qué línea es?</h3>
		<p>Elige una de tus líneas</p>
	</div>

	<div class="lines" role="radiogroup" aria-label="Línea">
		@for (line of subscriptions(); track line.id) {
		<label class="line" [class.line--selected]="line.id === selectedSubscriptionId()" [style.--line]="lines.color(line)">
			<input type="radio" name="subscription" class="line__input" [value]="line.id"
				[checked]="line.id === selectedSubscriptionId()" (change)="onSubscriptionChange(line.id.toString())">
			<span class="line__avatar" aria-hidden="true"><span class="material-symbols-outlined">smartphone</span></span>
			<span class="line__text">
				<strong>{{ lines.nickname(line) ?? lines.formatNumber(line.msisdn) }}</strong>
				<small>{{ lines.nickname(line) ? lines.formatNumber(line.msisdn) + ' · ' : '' }}{{ line.tariff.tariffName }}</small>
			</span>
			<span class="line__check material-symbols-outlined" aria-hidden="true">check_circle</span>
		</label>
		}
	</div>
</div>
