<div class="card">
    <h3 class="form-subtitle">Tarjeta de pago</h3>
    <p>Selecciona una tarjeta guardada</p>
    <div>
        <radio-field [options]="paymentCards()" [control]="paymentCardControl"
            (action)="onCardAction($event)"></radio-field>
    </div>
    <button (click)="onEditClick()" class="link-button">>> Añadir tarjeta</button>
</div>

<app-modal [size]="'lg'" [isOpen]="isModalOpen()" (closed)="onCancelModal()">
    <div class="modal-content">
        <div class="modal-content-info">
            <p class="info-content-title">Añadir nueva tarjeta</p>
            <div class="info-section">
                <p>Ingresa los datos de tu tarjeta.</p>
                <app-create-payment-method [customerId]="currentSubscription()?.customerId!"
                    (paymentMethodCreated)="onPaymentMethodSuccess()"></app-create-payment-method>
            </div>
        </div>
    </div>
</app-modal>

<ng-template #cardTemplate1>
    <span class="option-title">+ Agregar nueva tarjeta</span>
</ng-template>

<ng-template #cardTemplate2>
    <span class="option-title">Mastercard •••• 5555</span>
    <p class="option-description">Vencimiento: 08/2026</p>
</ng-template>

<ng-template #cardTemplate3>
    <span class="option-title">American Express •••• 3782</span>
    <p class="option-description">Vencimiento: 06/2027</p>
</ng-template>
