<!-- Mobile Layout -->
@if (isMobile()) {
<div id="mobile-payment" class="mobile-layout">
    <app-summary class="summary-section"></app-summary>
    <app-billing-info class="billing-section"></app-billing-info>
    <div class="button-section">
        <button class="btn" [disabled]="!canContinue()" (click)="onContinue()">Continuar</button>
    </div>
</div>
}

<!-- Desktop Layout -->
@else {
<div id="summary" class="flex">
    <div class="col-8">
        <app-payment-card-selector [currentSubscription]="currentSubscription()"></app-payment-card-selector>
        <app-payment-method-options></app-payment-method-options>
        <!-- <app-billing-info></app-billing-info> -->
    </div>
    <div class="col-4">
        <div id="cart-container">
            <app-summary></app-summary>
            <div class="button-section">
                <button class="btn" [disabled]="!canContinue()" (click)="onContinue()">Continuar</button>
            </div>
        </div>
    </div>
</div>
}
