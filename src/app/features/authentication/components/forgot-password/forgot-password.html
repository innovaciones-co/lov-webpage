<div class="forgot-password-container">
    <figure class="image-container">
        <img src="login.png" alt="">
    </figure>

    <!-- Header -->
    <div class="forgot-password-header">
        <h1 class="forgot-password-title">Recupera tu contraseña</h1>
        <p class="forgot-password-subtitle">
            Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>
    </div>

    <!-- Recovery Form -->
    <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" class="auth-form-wrapper">
        <div class="card">
            <div class="auth-form">
                <input-text-field [label]="'Correo electrónico'" [placeholder]="'tu@correo.com'"
                    [autocomplete]="'email'" [control]="emailControl" [error]="getEmailErrorMessage()">
                </input-text-field>
            </div>

            @if (error) {
            <div class="error-banner">
                <span class="error-icon">⚠️</span>
                <span class="error-message">{{ error.message }}</span>
            </div>
            }

            @if (isSubmitted) {
            <div class="success-banner">
                <span class="success-icon">✓</span>
                <span class="success-message">
                    Revisa tu correo electrónico para el enlace de recuperación.
                </span>
            </div>
            }
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-secondary" (click)="onBack()" [disabled]="isLoading">
                Atrás
            </button>

            <button type="submit" class="btn btn-primary" [disabled]="isLoading || recoveryForm.invalid">
                @if (isLoading) {
                <span class="loading-spinner"></span>
                Enviando...
                } @else {
                Enviar enlace
                }
            </button>
        </div>
    </form>
</div>
