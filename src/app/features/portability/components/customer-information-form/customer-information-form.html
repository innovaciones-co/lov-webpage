<form [formGroup]="form()" (ngSubmit)="onSubmit()">
    <div class="card">
        <h3 class="form-subtitle">Solicitar portabilidad</h3>
        <div class="form-grid">
            <div class="form-row">
                <input-text-field [label]="'NIP'" [placeholder]="'12345'" [control]="form().controls.nip"
                    [error]="getFieldErrorMessage('nip')"></input-text-field>

                <date-picker-field [label]="'Fecha de portabilidad'"
                    [placeholder]="'Ingresa la fecha en la que deseas que se active la portabilidad.'"
                    [control]="form().controls.portinDate"
                    [error]="getFieldErrorMessage('portinDate')"></date-picker-field>
            </div>
        </div>
    </div>
    <div class="card">
        <h3 class="form-subtitle">Información personal</h3>
        <div class="form-grid">
            <div class="form-row">
                <input-text-field [label]="'Nombre completo'" [placeholder]="''" [control]="form().controls.fullName"
                    [error]="getFieldErrorMessage('fullName')"></input-text-field>

                <input-text-field [label]="'Documento'" [placeholder]="'1234567890'"
                    [control]="form().controls.documentID"
                    [error]="getFieldErrorMessage('documentID')"></input-text-field>
            </div>
            <div class="form-row">
                <select-field [label]="'Tipo de documento'" [placeholder]="''" [options]="documentType()"
                    [control]="form().controls.documentType"
                    [error]="getFieldErrorMessage('documentType')"></select-field>

                <date-picker-field [label]="'Fecha de expedición'"
                    [placeholder]="'Ingresa la fecha de expedición de tu documento de identidad.'"
                    [control]="form().controls.documentIssueDate"
                    [error]="getFieldErrorMessage('documentIssueDate')"></date-picker-field>
            </div>
            <div class="form-row">
                <input-text-field [label]="'Dirección'" [placeholder]="'Cra 00 #00-00'"
                    [control]="form().controls.address" [error]="getFieldErrorMessage('address')"></input-text-field>
            </div>
            <checkbox-field [control]="form().controls.terms" [error]="getFieldErrorMessage('terms')">
                He leído y acepto los <a href="/docs/condiciones_servicio_prepago_lov.pdf" target="_blank"
                    class="link-button">Términos y Condiciones</a>, así como la <a
                    href="/docs/politicas_de_tratamiento_de_datos_personales_new.pdf" target="_blank"
                    class="link-button">Política de Tratamiento de Datos Personales</a>.
            </checkbox-field>
        </div>
        <error-card [message]="submitError()"></error-card>
    </div>
    <button class="btn" type="submit" [disabled]="form().invalid || isLoading()">
        @if (isLoading()) {
        <span class="loading-spinner"></span>
        Enviando...
        } @else {
        Solicitar portabilidad
        }
    </button>
</form>
