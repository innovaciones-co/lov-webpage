<div class="portability-status-container">
    <div class="form-wrapper">
        <form [formGroup]="form()" (ngSubmit)="onSubmit()">
            <div class="card">
                <h3 class="form-subtitle">Ingresa tú número LOV</h3>
                <div class="form-grid">
                    <input-text-field [label]="'Número de la SIM LOV'" [placeholder]="'3001234567'"
                        [control]="form().controls.lovNumber"
                        [error]="getFieldErrorMessage('lovNumber')"></input-text-field>
                </div>
                <error-card [message]="validationError()"></error-card>
            </div>

            @if (hasSearched() && !isLoading() && !validationError()) {
            @let display = statusDisplay();
            @if (display) {
            <div class="card">
                <div class="status-card__state">
                    <!-- <div class="status-card__state" [ngClass]="display.cssClass"> -->
                    <h3 class="status-title form-subtitle">Estado de la portabilidad</h3>
                    <p> Estado: <em><b>{{ display.status }}</b></em></p>
                    <p [innerHTML]="display.message"></p>
                </div>
            </div>
            }
            }

            <button class="btn" type="submit" [disabled]="isLoading() || form().invalid">
                @if (isLoading()) {
                <span class="loading-spinner"></span>
                Validando...
                } @else {
                Consultar
                }
            </button>
        </form>
    </div>
</div>
