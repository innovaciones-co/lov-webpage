<div class="stepper-container">
    <!-- Step Content -->
    <div class="step-content-container">
        @switch (currentStepIndex()) {
        @case (0) {
        <div class="form-wrapper">
            <app-portability-information-form
                (formSubmit)="onPortabilityInformationSubmit($event)"></app-portability-information-form>
        </div>
        }
        @case (1) {
        <div class="form-wrapper">
            @if (portabilityData()) {
            <app-donor-information-form [portabilityData]="portabilityData()!"
                (formSubmit)="onDonorInformationSubmit($event)"></app-donor-information-form>
            }
        </div>
        }
        @case (2) {
        <div class="form-wrapper">
            <app-customer-information-form
                (formSubmit)="onCustomerInformationSubmit($event)"></app-customer-information-form>
        </div>
        }
        }
    </div>
</div>
