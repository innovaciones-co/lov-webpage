name: Release and Build Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  docker:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build \
          -t sdtorresl/lov-webpage:${{ needs.release.outputs.new_version }} \
          -t sdtorresl/lov-webpage:latest .

      - name: Push image
        run: |
          docker push sdtorresl/lov-webpage:${{ needs.release.outputs.new_version }}
          docker push sdtorresl/lov-webpage:latest
